<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FH1 V1 concept</title>
<!-- Conceptual 3D view of the V1 build. Part positions come from board-render.html (front-view mm, 80 × 120 board);
     wires from its WIRES / WIRES2 data. ?view=hero | open | back. Rendered to PNG with headless Chromium. -->
<style>
  html, body { margin: 0; height: 100%; background: #15171a; overflow: hidden; }
  canvas { display: block; }
  nav { position: fixed; top: 16px; left: 16px; display: flex; gap: 8px; font: 600 14px/1 system-ui, sans-serif; }
  nav button { font: inherit; color: #e6e9ee; background: rgba(40, 44, 50, 0.85); border: 1px solid #4a5059; border-radius: 6px; padding: 9px 14px; cursor: pointer; }
  nav button:hover { background: rgba(60, 66, 75, 0.9); }
  nav button[aria-pressed="true"] { background: #e6e9ee; color: #15171a; border-color: #e6e9ee; }
</style>
</head>
<body>
<nav aria-label="Views">
  <button data-view="hero">Front</button>
  <button data-view="open">Laid open</button>
  <button data-view="back">Back</button>
</nav>
<script>
// A classic script with dynamic imports (no import map), so previewers that re-run scripts as classic ones still work.
// The +esm builds of the addons import the same three.js build, so they share one THREE.
(async () => {
const CDN = 'https://cdn.jsdelivr.net/npm/three@0.160.0';
const [THREE, { RoomEnvironment }, { RoundedBoxGeometry }, { OrbitControls }] = await Promise.all([
  import(`${CDN}/+esm`),
  import(`${CDN}/examples/jsm/environments/RoomEnvironment.js/+esm`),
  import(`${CDN}/examples/jsm/geometries/RoundedBoxGeometry.js/+esm`),
  import(`${CDN}/examples/jsm/controls/OrbitControls.js/+esm`),
]);


// ── Geometry from board-render.html (front-view mm; back-view x' = 80 − x) ──
const W = 80, H = 120, T = 1.2, GAP = 25;
const gx = i => 3.17 + 2.54 * i, gy = j => 7.93 + 2.54 * j;
const Z_MAIN_BACK = -T, Z_INNER = -T - GAP, Z_OUTER = Z_INNER - T;
const BTN = { X: [60.32, 63.81], Y: [47.62, 76.51], A: [73.02, 76.51], B: [60.32, 89.21] };
const CAP = { A: '#e5302c', B: '#f4c21f', X: '#2f6fe8', Y: '#2fb36a' };
const SS = { Select: [18.41, 94.29], Start: [31.11, 94.29] };
const MENU = [40.0, 61.27];
const DISP = { x: -2.15, y: 0.89, w: 81.28, h: 54.74 };
const SPACERS = [[3, 3, true], [77, 3, true], [3, 94.5, false], [77, 94.5, false]];
const NETC = { radio: '#ff9f1c', disp: '#3d8bff', sd: '#1fd1b2', i2s: '#a46cff', i2c: '#ffd23f', int: '#ff7a2e', adc: '#6fdc8c',
  pwm: '#ff6fae', boot: '#ff7a2e', btn: '#eeeeee', led: '#ff4d4d', v33: '#eeeeee', vsys: '#e8322c', gnd: '#1b1b1b' };

// ── Renderer, scene, light ──
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1a1d21');
scene.fog = new THREE.Fog('#1a1d21', 420, 900);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight('#fff4e6', 2.2);
key.position.set(-160, 260, 200);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -180, right: 180, top: 180, bottom: -180, near: 10, far: 800 });
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);
const rim = new THREE.DirectionalLight('#9fc4ff', 1.1);
rim.position.set(220, 80, -260);
scene.add(rim);
scene.add(new THREE.HemisphereLight('#dfe8ff', '#202020', 0.35));

const floor = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshStandardMaterial({ color: '#2a2d31', roughness: 0.85 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = -H / 2 - 0.01;
floor.receiveShadow = true;
scene.add(floor);

// ── Helpers ──
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0, ...o });
const M = {
  pcbBlue: std('#1d5fc4', { roughness: 0.45 }), pcbBlack: std('#141518', { roughness: 0.4 }), pcbGreen: std('#1f6b3c', { roughness: 0.45 }),
  plastic: std('#151515', { roughness: 0.6 }), white: std('#ecebe6', { roughness: 0.5 }), gold: std('#d4a64a', { metalness: 1, roughness: 0.28 }),
  steel: std('#c9ccd1', { metalness: 1, roughness: 0.25 }), darkSteel: std('#55595f', { metalness: 1, roughness: 0.35 }),
  tin: std('#d6d8dc', { metalness: 1, roughness: 0.2 }), chip: std('#202224', { roughness: 0.35 }), nylon: std('#f1efe8', { roughness: 0.7 }),
  fr4Edge: std('#b9b47a', { roughness: 0.7 }),
};
const main = new THREE.Group(), second = new THREE.Group();
scene.add(main, second);

// A box over the front-view rectangle x0..x0+w, y0..y0+h, from z0 to z0+d (d < 0 goes back).
function box(parent, x0, y0, w, h, z0, d, mat, round = 0) {
  const geo = round ? new RoundedBoxGeometry(w, h, Math.abs(d), 2, round) : new THREE.BoxGeometry(w, h, Math.abs(d));
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x0 + w / 2 - W / 2, H / 2 - (y0 + h / 2), z0 + d / 2);
  parent.add(m);
  return m;
}
function cyl(parent, cx, cy, r, z0, d, mat, seg = 32, r2 = r) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r2, r, Math.abs(d), seg), mat);
  m.rotation.x = Math.PI / 2 * Math.sign(d || 1);
  m.position.set(cx - W / 2, H / 2 - cy, z0 + d / 2);
  parent.add(m);
  return m;
}
const bx = (x, w) => W - x - w;      // back-view rect → front-view x0
const v3 = (x, y, z) => new THREE.Vector3(x - W / 2, H / 2 - y, z);

function canvasTex(wmm, hmm, ppm, draw) {
  const c = document.createElement('canvas');
  c.width = Math.round(wmm * ppm); c.height = Math.round(hmm * ppm);
  const g = c.getContext('2d');
  g.scale(ppm, ppm);
  draw(g, wmm, hmm);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
// A module board with a printed top: silkscreen text and a few chips.
function moduleTop(bg, label, chips = [], silk = '#e8e8e8') {
  return (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.strokeStyle = silk; g.lineWidth = 0.18; g.strokeRect(0.8, 0.8, w - 1.6, h - 1.6);
    for (const [x, y, cw, ch, c] of chips) { g.fillStyle = c || '#1b1c1e'; g.fillRect(x, y, cw, ch); }
    g.fillStyle = silk; g.font = `bold ${Math.min(2.6, w / 8)}px sans-serif`; g.textAlign = 'center';
    g.fillText(label, w / 2, h - 2);
  };
}
function moduleBoard(parent, x0, y0, w, h, z0, dir, bg, label, chips, thick = 1.6) {
  const top = new THREE.MeshStandardMaterial({ map: canvasTex(w, h, 12, moduleTop(bg, label, chips)), roughness: 0.42 });
  const edge = std(bg, { roughness: 0.5 });
  const mats = [edge, edge, edge, edge, dir > 0 ? top : edge, dir > 0 ? edge : top];
  return box(parent, x0, y0, w, h, z0, dir * thick, mats);
}
// A strip of header pins: plastic body and pin tips, along x or y.
function header(parent, x, y, n, axis, z0, d, female = false) {
  const len = 2.54 * n, w = axis === 'y' ? 2.54 : len, h = axis === 'y' ? len : 2.54;
  box(parent, x - 1.27, y - 1.27, w, h, z0, d, M.plastic, 0.2);
  if (female) return;
  for (let k = 0; k < n; k++) {
    const px = axis === 'y' ? x : x + 2.54 * k, py = axis === 'y' ? y + 2.54 * k : y;
    box(parent, px - 0.32, py - 0.32, 0.64, 0.64, z0, d * 1.25, M.gold);
  }
}

// ── Perfboard texture: 30 × 42 tinned pads on FR4 ──
function perfTex(extra) {
  return canvasTex(W, H, 9, g => {
    const grd = g.createLinearGradient(0, 0, W, H);
    grd.addColorStop(0, '#2c7a44'); grd.addColorStop(1, '#245f37');
    g.fillStyle = grd; g.fillRect(0, 0, W, H);
    for (let k = 0; k < 3500; k++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.06})`; g.fillRect(Math.random() * W, Math.random() * H, 0.4, 0.4); }
    for (let i = 0; i < 30; i++) for (let j = 0; j < 42; j++) {
      g.fillStyle = '#c8c3b5'; g.beginPath(); g.arc(gx(i), gy(j), 0.95, 0, 7); g.fill();
      g.fillStyle = '#0d0f0e'; g.beginPath(); g.arc(gx(i), gy(j), 0.5, 0, 7); g.fill();
    }
    for (const [x, y] of [[3, 3], [77, 3], [3, 117], [77, 117], [3, 94.5], [77, 94.5]]) {
      g.fillStyle = '#c8c3b5'; g.beginPath(); g.arc(x, y, 2.6, 0, 7); g.fill();
      g.fillStyle = '#0d0f0e'; g.beginPath(); g.arc(x, y, 1.65, 0, 7); g.fill();
    }
    extra?.(g);
  });
}
const grille = flipX => g => {
  for (let x = 21; x < 53; x += 3.2) for (let y = 73; y < 94; y += 3.2) {
    g.fillStyle = '#050505'; g.beginPath(); g.arc(flipX ? W - x : x, y, 1.1, 0, 7); g.fill();
  }
};
function perfboard(parent, zFront, frontExtra, backExtra) {
  const f = new THREE.MeshStandardMaterial({ map: perfTex(frontExtra), roughness: 0.45, metalness: 0.05 });
  const b = new THREE.MeshStandardMaterial({ map: perfTex(backExtra), roughness: 0.45, metalness: 0.05 });
  return box(parent, 0, 0, W, H, zFront, -T, [M.fr4Edge, M.fr4Edge, M.fr4Edge, M.fr4Edge, f, b]);
}
perfboard(main, 0);
perfboard(second, Z_INNER, grille(false), grille(true));

// ── Screen content: the virtual-pet home screen (320 × 240 logical pixels) ──
function screenTex() {
  const c = document.createElement('canvas'); c.width = 640; c.height = 480;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.scale(2, 2);
  const sky = g.createLinearGradient(0, 0, 0, 240);
  sky.addColorStop(0, '#7fd3ff'); sky.addColorStop(0.65, '#d9f3ff'); sky.addColorStop(0.66, '#7cc95a'); sky.addColorStop(1, '#4e9a3c');
  g.fillStyle = sky; g.fillRect(0, 0, 320, 240);
  // clouds and sun
  g.fillStyle = '#fff6b0'; g.fillRect(262, 30, 24, 24); g.fillStyle = '#ffe36e'; g.fillRect(266, 34, 16, 16);
  g.fillStyle = '#ffffff';
  for (const [x, y] of [[40, 44], [150, 30], [200, 60]]) { g.fillRect(x, y, 36, 8); g.fillRect(x + 8, y - 6, 20, 6); }
  // ground tufts
  g.fillStyle = '#3f8a30';
  for (let x = 4; x < 320; x += 13) g.fillRect(x, 162 + (x * 7 % 5), 3, 4);
  // pet: a pixel blob with ears, built from an ellipse on a 22 × 18 grid
  const P = 5, ox = 105, oy = 72, cols = 22, rows = 18, inside = (i, j) => {
    const e = ((i - 11) / 9.5) ** 2 + ((j - 11) / 6.8) ** 2 <= 1;
    const ear = (j >= 1 && j <= 5) && ((Math.abs(i - 5) <= (j - 1) / 2) || (Math.abs(i - 17) <= (j - 1) / 2));
    return e || ear;
  };
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    if (!inside(i, j)) continue;
    const edge = !inside(i - 1, j) || !inside(i + 1, j) || !inside(i, j - 1) || !inside(i, j + 1);
    g.fillStyle = edge ? '#2b1d3a' : (j > 13 ? '#e88a3a' : '#ffa94d');
    g.fillRect(ox + i * P, oy + j * P, P, P);
  }
  const px = (i, j, c, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(ox + i * P, oy + j * P, w * P, h * P); };
  px(7, 8, '#2b1d3a', 2, 3); px(13, 8, '#2b1d3a', 2, 3); px(7, 8, '#ffffff'); px(13, 8, '#ffffff');
  px(5, 12, '#ff6f91', 2, 1); px(15, 12, '#ff6f91', 2, 1);
  px(10, 12, '#2b1d3a', 2, 1); px(9, 11, '#2b1d3a'); px(12, 11, '#2b1d3a');
  px(5, 3, '#ff6f91'); px(17, 3, '#ff6f91');
  g.fillStyle = 'rgba(0,0,0,0.18)'; g.fillRect(ox + 15, oy + rows * P + 2, 90, 6);
  // heart above
  g.fillStyle = '#ff3d6e';
  for (const [i, j] of [[1, 0], [2, 0], [4, 0], [5, 0], [0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [1, 2], [2, 2], [3, 2], [4, 2], [5, 2], [2, 3], [3, 3], [4, 3], [3, 4]])
    g.fillRect(206 + i * 4, 58 + j * 4, 4, 4);
  // status bar
  g.fillStyle = 'rgba(16,20,40,0.82)'; g.fillRect(0, 0, 320, 20);
  g.fillStyle = '#ffffff'; g.font = 'bold 13px monospace'; g.textBaseline = 'middle';
  g.fillText('FH1', 6, 10); g.fillText('09:41', 140, 10);
  g.fillStyle = '#ffb347'; for (let k = 0; k < 4; k++) g.fillRect(250 + k * 5, 15 - k * 3, 3, 3 + k * 3);
  g.strokeStyle = '#ffffff'; g.lineWidth = 1.5; g.strokeRect(282, 5, 26, 11); g.fillStyle = '#ffffff'; g.fillRect(308, 8, 3, 5);
  g.fillStyle = '#6fdc8c'; g.fillRect(284, 7, 17, 7);
  // stat meters
  g.font = 'bold 10px monospace';
  [['FOOD', '#ffb347', 0.8], ['FUN', '#ff6fae', 0.55], ['ZZZ', '#7f9cff', 0.9]].forEach(([n, c, v], k) => {
    const y = 28 + k * 14;
    g.fillStyle = 'rgba(16,20,40,0.6)'; g.fillRect(6, y, 92, 11);
    g.fillStyle = '#ffffff'; g.fillText(n, 9, y + 6);
    g.fillStyle = c; g.fillRect(42, y + 2, 52 * v, 7);
  });
  // dock
  g.fillStyle = 'rgba(16,20,40,0.86)'; g.fillRect(0, 196, 320, 44);
  ['PET', 'GAMES', 'RADIO', 'FILES'].forEach((n, k) => {
    const x = 16 + k * 76;
    g.fillStyle = k === 0 ? '#ffa94d' : '#3a4366'; g.fillRect(x, 202, 60, 32);
    g.fillStyle = k === 0 ? '#2b1d3a' : '#e6e9ff'; g.font = 'bold 12px monospace'; g.textAlign = 'center';
    g.fillText(n, x + 30, 219);
  });
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter;
  return t;
}

// ── Front face ──
// display: male header (2.5 mm plastic) on column 29, blue PCB, LCD with bezel, glass
const DZ = 2.5;
header(main, DISP.x + 78.98, DISP.y + 17.2, 9, 'y', 0, DZ, true);
moduleBoard(main, DISP.x, DISP.y, DISP.w, DISP.h, DZ, 1, '#1d5fc4', '', [], 1.6);
for (const [x, y] of [[DISP.x + 2.6, DISP.y + 2.6], [DISP.x + DISP.w - 2.6, DISP.y + 2.6], [DISP.x + 2.6, DISP.y + DISP.h - 2.6], [DISP.x + DISP.w - 2.6, DISP.y + DISP.h - 2.6]])
  cyl(main, x, y, 1.6, DZ + 1.6, 0.05, std('#d9d9d9', { metalness: 1, roughness: 0.3 }));
const LCD = { x: 7.85, y: 3.0, w: 69.0, h: 50.6 };
box(main, LCD.x, LCD.y, LCD.w, LCD.h, DZ + 1.6, 2.8, std('#0c0d10', { roughness: 0.35 }), 0.3);
const ACT = { x: DISP.x + 14.18, y: DISP.y + 5.77, w: 57.6, h: 43.2 };
const scr = new THREE.Mesh(new THREE.PlaneGeometry(ACT.w, ACT.h), new THREE.MeshBasicMaterial({ map: screenTex(), toneMapped: false }));
scr.position.copy(v3(ACT.x + ACT.w / 2, ACT.y + ACT.h / 2, DZ + 4.42));
main.add(scr);
const glass = new THREE.Mesh(new THREE.PlaneGeometry(LCD.w - 0.6, LCD.h - 0.6),
  new THREE.MeshPhysicalMaterial({ color: '#000000', transparent: true, opacity: 0.12, roughness: 0.04, metalness: 0, clearcoat: 1, envMapIntensity: 2.2 }));
glass.position.copy(v3(LCD.x + LCD.w / 2, LCD.y + LCD.h / 2, DZ + 4.46));
main.add(glass);
// a soft glow of the screen on the board below it
const glow = new THREE.PointLight('#bfe6ff', 0.6, 60, 2);
glow.position.copy(v3(41, 28, 25)); main.add(glow);

// lit buttons: TS-G010, 12 × 12 body, white insert, coloured lit cap
for (const [n, [cx, cy]] of Object.entries(BTN)) {
  box(main, cx - 6, cy - 6, 12, 12, 0, 3.6, M.plastic, 0.5);
  box(main, cx - 4.9, cy - 4.9, 9.8, 9.8, 3.6, 0.7, M.white, 0.3);
  box(main, cx - 7.5, cy - 1, 3, 2, 0.5, 2.6, M.white); box(main, cx + 4.5, cy - 1, 3, 2, 0.5, 2.6, M.white);
  for (const [dx, dy] of [[-3.6, -3.6], [3.6, -3.6], [-3.6, 3.6]]) cyl(main, cx + dx, cy + dy, 0.6, 4.3, 0.15, M.plastic, 12);
  cyl(main, cx, cy, 4.6, 4.3, 1.0, M.white, 40);
  const c = new THREE.Color(CAP[n]);
  cyl(main, cx, cy, 4.1, 5.3, 2.0, new THREE.MeshPhysicalMaterial({ color: c, emissive: c, emissiveIntensity: 0.55, roughness: 0.18, clearcoat: 1, transmission: 0, transparent: true, opacity: 0.94 }), 40, 3.9);
  const l = new THREE.PointLight(c, 0.5, 18, 2); l.position.copy(v3(cx, cy, 10)); main.add(l);
}
// Start / Select: plain 7.8 mm, white actuator
for (const [cx, cy] of Object.values(SS)) {
  box(main, cx - 3.9, cy - 3.9, 7.8, 7.8, 0, 3.5, M.plastic, 0.3);
  box(main, cx - 3.6, cy - 3.6, 7.2, 7.2, 3.5, 0.2, M.steel);
  cyl(main, cx, cy, 1.75, 3.7, 1.8, M.white, 24);
}
// Menu (BOOT): small 6 × 6 tact
box(main, MENU[0] - 3, MENU[1] - 3, 6, 6, 0, 3.4, M.plastic, 0.2);
box(main, MENU[0] - 2.9, MENU[1] - 2.9, 5.8, 5.8, 3.4, 0.2, M.steel);
cyl(main, MENU[0], MENU[1], 1.6, 3.6, 1.2, M.plastic, 20);
// thumbstick: Deek-Robot JOYSTICK-02 on straight pins
{
  const [x, y, s] = [6.27, 62.41, 25.8], cx = x + s / 2, cy = y + s / 2;
  header(main, gx(5), gy(22), 4, 'x', 0, 2.5, true);
  moduleBoard(main, x, y, s, s, 2.5, 1, '#1a73b8', 'JOYSTICK-02', [], 1.6);
  box(main, cx - 9, cy - 9, 18, 18, 4.1, 3.4, M.steel, 0.6);
  box(main, cx - 7.5, cy - 7.5, 15, 15, 7.5, 1.2, M.plastic, 0.5);
  cyl(main, cx, cy, 4, 8.7, 2.4, M.plastic, 24);
  const cap = cyl(main, cx, cy, 8.4, 11.1, 2.6, std('#141414', { roughness: 0.75 }), 48, 7.6);
  cyl(main, cx, cy, 7.4, 13.7, 0.4, std('#1c1c1c', { roughness: 0.9 }), 48, 6.6);
}
// off switch: SS12D00 at the right edge, lever to the side
box(main, 75.8, 57, 4.2, 9, 0, 3.5, M.steel);
box(main, 79.2, 60.5, 3.2, 2, 1, 1.5, M.plastic);

// ── Main board back (back-view coordinates mirrored) ──
const ZB = Z_MAIN_BACK;
// ESP32-S3 mini on female sockets (8.5 mm), USB-C at the outer edge
{
  const x = bx(5.25, 32), y = 9.43;
  for (const j of [1, 2, 8, 9]) header(main, W - gx(12), gy(j), 11, 'x', ZB, -8.5, true);
  const s3 = moduleBoard(main, x, y, 32, 22.4, ZB - 8.5, -1, '#141518', 'ESP32-S3 N16R8', [[9, 7, 7, 7, '#2a2c2f'], [17, 9, 3, 4]]);
  box(main, x + 9, y + 7.6, 7, 7, ZB - 10.1, -0.9, M.chip);
  box(main, x + 15.6, y + 10.2, 3, 3, ZB - 10.1, -0.6, std('#e8e8e8'));
  box(main, x + 27.5, y + 7.6, 6.5, 9, ZB - 10.1, -3.2, M.steel, 0.9);     // USB-C (outer edge = front-view right)
  box(main, x + 2, y + 15, 3, 2.5, ZB - 10.1, -0.8, M.gold);              // IPEX
}
// modules soldered on 2.5 mm pin plastic
const backMod = (xb, y, w, h, bg, label, chips, d = -2.5) => moduleBoard(main, bx(xb, w), y, w, h, ZB + d, -1, bg, label, chips);
header(main, W - gx(15), gy(0), 10, 'y', ZB, -2.5, true);
backMod(39.67, 6.31, 17, 26.1, '#151515', 'ES8311', [[4, 6, 5, 5], [9, 15, 4, 4]]);
box(main, bx(42, 7), 22, 7, 7, ZB - 4.1, -1, M.chip);
header(main, W - gx(22), gy(1), 9, 'y', ZB, -2.5, true);

function wireMesh(parent, pts, color, z) {
  const path = new THREE.CurvePath();
  const v = pts.map(([x, y]) => v3(x, y, z));
  for (let k = 1; k < v.length; k++) if (v[k].distanceTo(v[k - 1]) > 0.01) path.add(new THREE.LineCurve3(v[k - 1], v[k]));
  if (!path.curves.length) return;
  const m = new THREE.Mesh(new THREE.TubeGeometry(path, path.curves.length * 6, 0.45, 8, false), std(color, { roughness: 0.35 }));
  parent.add(m);
}

  // laid open like a book: the main board turned to show its back, the second board its inner face
  main.rotation.y = open ? Math.PI : 0;
  main.position.x = open ? -47 : 0;
  second.position.set(open ? 47 : 0, 0, open ? -Z_INNER : 0);
  cam.position.set(...VIEWS[name].pos);
  controls.target.set(...VIEWS[name].at);
  controls.update();
  for (const b of document.querySelectorAll('nav button')) b.setAttribute('aria-pressed', b.dataset.view === name);
  const url = new URL(location.href);
  url.searchParams.set('view', name);
  try { history.replaceState(null, '', url); } catch {}   // some browsers refuse this on file://
}
for (const b of document.querySelectorAll('nav button')) b.addEventListener('click', () => setView(b.dataset.view));
setView(new URLSearchParams(location.search).get('view'));
addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
function frame() { controls.update(); renderer.render(scene, cam); }
renderer.setAnimationLoop(frame);
})();
</script>
</body>
</html>
